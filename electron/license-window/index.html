<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Outboundly — License</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d12;
        color: #e6e8ec;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .card {
        width: 380px;
        padding: 28px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      .banner {
        display: none;
        background: #3a1f1f;
        border: 1px solid #7a3535;
        color: #ffb4b4;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        color: #b7bcc7;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #2a2f3a;
        background: #14171e;
        color: #e6e8ec;
        font-size: 14px;
        margin-bottom: 12px;
      }
      .error {
        display: none;
        color: #ff8080;
        font-size: 13px;
        margin: -4px 0 12px;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        border: none;
        font-size: 14px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      #activateButton {
        background: #4a7dff;
        color: white;
      }
      #activateButton:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #quitButton {
        background: transparent;
        color: #9aa0ac;
        border: 1px solid #2a2f3a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Activate Outboundly</h1>
      <div class="banner" id="banner"></div>
      <label for="licenseKeyInput">License key</label>
      <input id="licenseKeyInput" type="text" placeholder="Paste your license key" autocomplete="off" spellcheck="false" />
      <div class="error" id="error"></div>
      <button id="activateButton">Activate</button>
      <button id="quitButton">Quit</button>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
